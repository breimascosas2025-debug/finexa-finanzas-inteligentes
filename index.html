<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Finexa - Finanzas Inteligentes</title>
    <meta name="description" content="Gestión financiera manual y conectada en colones (₡) para Costa Rica. Control de cuentas, fuentes de dinero, ingresos, gastos por cuenta, deudas y seguridad con PIN." />
    <meta property="og:title" content="Finexa - Finanzas Inteligentes" />
    <meta property="og:description" content="Gestión financiera manual y conectada en colones (₡) para Costa Rica. Control de cuentas, fuentes de dinero, ingresos, gastos por cuenta, deudas y seguridad con PIN." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f131c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finexa" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined for pixel-perfect match with screenshots -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <!-- Google Identity Services (GSI) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      @keyframes pulseFinexa {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      @keyframes finexaShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .finexa-loader-circle {
        animation: pulseFinexa 2s infinite ease-in-out;
      }
      .finexa-bar-inner {
        animation: finexaShimmer 1.4s infinite ease-in-out;
      }
    </style>
  </head>
  <body class="bg-[#0f131c] text-[#dfe2ee] font-['Plus_Jakarta_Sans',sans-serif] antialiased selection:bg-[#10b981] selection:text-[#003824]">
    <div id="root">
      <!-- Loading Splash Screen with Official Finexa Logo -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #070b14; padding: 20px;">
        <div class="finexa-loader-circle" style="position: relative; width: 88px; height: 88px; border-radius: 24px; background: radial-gradient(circle at 30% 30%, #0d1726, #050810); display: flex; align-items: center; justify-content: center; box-shadow: 0 16px 36px -4px rgba(0, 102, 255, 0.35); border: 1px solid rgba(0, 180, 216, 0.4); overflow: hidden;">
          <img src="/finexa-logo.png" alt="Finexa" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='/icon.svg'" />
        </div>
        <div style="margin-top: 20px; font-weight: 900; font-size: 20px; letter-spacing: 0.05em; color: #ffffff;">Fine<span style="color: #00d2ff;">x</span>a</div>
        <div style="margin-top: 4px; font-size: 11px; color: #86948a; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;">Finanzas Inteligentes</div>
        <div style="margin-top: 18px; width: 48px; height: 3px; border-radius: 999px; background: rgba(0, 102, 255, 0.2); overflow: hidden; position: relative;">
          <div class="finexa-bar-inner" style="width: 100%; height: 100%; background: linear-gradient(90deg, #0066ff, #00f59b); border-radius: 999px;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration for offline functionality without WiFi
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.warn('SW registration info:', err);
          });
        });
      }
    </script>
  </body>
</html>
